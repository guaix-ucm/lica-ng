# ===============================
# WORKSPACE MASTER PYPROJECT FILE
# ===============================

# Every subproject here may have a separate entry in PyPi
# tagging must be per-project. Example: git tag azotea-cli-0.1.0
[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
lica-log = { workspace = true }
lica-cli = { workspace = true }
lica-tables = { workspace = true }
lica-sqa = { workspace = true }
lica-raw =  { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "pytest",
]
